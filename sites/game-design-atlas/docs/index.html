<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="28 周 PC 游戏设计课程。用交互知识图谱、品类实验、真实玩家研究和设计检查点完成自己的试玩版。">
  <meta name="theme-color" content="#f5f6ee">
  <title>游戏设计学习图谱</title>
  <link rel="icon" type="image/svg+xml" href="./atlas.svg">
  <link rel="stylesheet" href="./embed-skin.css">
  <script src="./embed-bridge.js"></script>
  <link rel="stylesheet" href="./atlas.css">
  <link rel="stylesheet" href="./study.css?v=guided-3">
  <script type="module" src="./app.js?v=guided-3"></script>
</head>
<body>
  <a class="skip" href="#main">跳到学习内容</a>
  <header class="site-header">
    <div class="frame header-grid">
      <a class="brand" href="#graph" aria-label="游戏设计图谱首页"><img src="./atlas.svg" alt="" width="32" height="32"> <span>游戏设计图谱</span></a>
      <nav class="top-nav" aria-label="学习导航"><a href="#graph" data-nav="graph">知识图谱</a><a href="#plan" data-nav="plan">分步课程</a><a href="#coach" data-nav="coach">AI 学习工坊</a></nav>
      <a class="header-progress" href="#plan" aria-label="查看课内学习进度"><span class="progress-track" aria-hidden="true"><i id="progress-fill"></i></span><span id="progress-count">0 / 28</span></a>
    </div>
  </header>
  <main id="main" class="frame" tabindex="-1">
    <section id="graph-view" aria-label="知识图谱">
      <div class="hero">
        <div><h1>游戏设计学习图谱<span>.</span></h1><p>从第一条玩法规则，到一份玩家能独立上手的 PC 试玩版。</p></div>
        <div class="hero-stats" aria-label="课程概况"><div><strong>28</strong><span>周课程</span></div><div><strong>08</strong><span>品类实验</span></div><div><strong>04</strong><span>完整项目</span></div></div>
      </div>
      <div class="overview">
        <section class="graph-panel panel" aria-labelledby="graph-title">
          <div class="graph-toolbar"><div><h2 id="graph-title">知识图谱</h2><p>选择任意节点，查看学习内容与先修关系。</p></div><div class="zoom-controls" aria-label="图谱缩放"><button type="button" id="zoom-out" aria-label="缩小">−</button><button type="button" id="zoom-reset" aria-label="恢复默认缩放">100%</button><button type="button" id="zoom-in" aria-label="放大">+</button></div></div>
          <div class="graph-scroll" id="graph-scroll" tabindex="0" aria-label="可横向滚动的课程图谱"><div id="graph-canvas"></div></div>
          <div id="map-legend" class="map-legend" aria-label="学习阶段"></div>
        </section>
        <aside id="preview" class="preview panel" aria-label="所选课程"></aside>
      </div>
      <section class="route-section" aria-labelledby="route-title"><div class="section-heading"><h2 id="route-title">学习路线</h2><a class="text-link" href="#plan">查看全部 28 周 <span aria-hidden="true">↗</span></a></div><div class="phase-route" id="phase-route"></div></section>
    </section>
    <section id="plan-view" hidden aria-label="分步课程">
      <div class="subhero study-hero"><h1>分步课程</h1><p>先学原理，再动手验证，最后把学到的方法用在陌生案例上。</p></div>
      <div class="study-grid"><section class="panel week-index" aria-label="课程目录"><label class="search-label" for="search-weeks">搜索课程</label><input type="search" id="search-weeks" placeholder="例如 数值、解谜、访谈"><div id="week-list"></div></section><article id="lesson" class="panel lesson" aria-label="课程详情"></article></div>
    </section>
    <section id="coach-view" hidden aria-label="AI 学习工坊">
      <div class="subhero"><h1>AI 学习工坊</h1><p>先写下你的设计判断。AI 可以追问、检查证据，或整理你明确授权的规则。</p></div>
      <div id="coach-content"></div>
    </section>
  </main>
  <footer class="frame footer"><span>游戏设计学习图谱 · 28 周实践课程</span><div><button id="export-progress" class="link-button" type="button">导出学习记录</button><button id="import-progress" class="link-button" type="button">导入</button><input hidden type="file" id="progress-file" accept=".json,application/json"><a href="https://github.com/passwordis42/game-design-atlas" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></footer>
  <div id="announcement" class="announcement" hidden role="status"></div>
  <noscript>此学习图谱需要启用 JavaScript 才能打开课程。</noscript>
</body>
</html>
