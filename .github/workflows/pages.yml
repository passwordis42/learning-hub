name: Publish learning hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run install:sites
      - run: npm run build
        env:
          HUB_BASE: /learning-hub/
          LEARNING_HUB_PUBLIC_BAILIAN_KEY: ${{ secrets.LEARNING_HUB_PUBLIC_BAILIAN_KEY }}
          LEARNING_HUB_PUBLIC_BAILIAN_REGION: ${{ vars.LEARNING_HUB_PUBLIC_BAILIAN_REGION }}
          LEARNING_HUB_PUBLIC_BAILIAN_MODEL: ${{ vars.LEARNING_HUB_PUBLIC_BAILIAN_MODEL }}
          LEARNING_HUB_PUBLIC_BAILIAN_WORKSPACE: ${{ vars.LEARNING_HUB_PUBLIC_BAILIAN_WORKSPACE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
